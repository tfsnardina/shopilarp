name: ShopifyLarp
options:
  bundleIdPrefix: com.checker
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  ShopifyLarp:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - www/**
          - ShopifyWeb.bundle/**
          - Assets.xcassets/**
          - project.yml
          - "*.md"
          - sync-www.ps1
          - .git/**
          - .github/**
          - scripts/**
      - path: Assets.xcassets
      - path: ShopifyWeb.bundle
        type: folder
        buildPhase: resources
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.checker.shopifylarp
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        MARKETING_VERSION: "1.0.21"
        CURRENT_PROJECT_VERSION: "21"
    postbuildScripts:
      - name: Ensure ShopifyWeb.bundle in app
        script: |
          set -e
          DST="${TARGET_BUILD_DIR}/${WRAPPER_NAME}/ShopifyWeb.bundle"
          SRC="${SRCROOT}/ShopifyWeb.bundle"
          test -d "$SRC"
          mkdir -p "$DST"
          ditto "$SRC" "$DST"
          test -f "$DST/index.html"
          PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          # iOS letterboxes the app when the built Info.plist has no launch screen.
          # xcodegen was dropping UILaunchScreen, so write it into the product plist.
          /usr/libexec/PlistBuddy -c "Delete :UILaunchStoryboardName" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Delete :UILaunchScreen" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :UILaunchScreen dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :UIRequiresFullScreen true" "$PLIST" || /usr/libexec/PlistBuddy -c "Add :UIRequiresFullScreen bool true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.21" "$PLIST" || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 1.0.21" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 21" "$PLIST" || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string 21" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Shopify" "$PLIST" || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Shopify" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :UILaunchScreen" "$PLIST"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")" = "1.0.21"
