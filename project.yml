name: ShopifyLarp
options:
  bundleIdPrefix: com.checker
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  ShopifyLarp:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - www/**
          - ShopifyWeb.bundle/**
          - Assets.xcassets/**
          - project.yml
          - cha-ching.caf
          - "*.md"
          - sync-www.ps1
          - .git/**
          - .github/**
          - scripts/**
          - ShopifyWidgets/**
          - Config/**
      - path: Assets.xcassets
      - path: cha-ching.caf
        buildPhase: resources
      - path: ShopifyWeb.bundle
        type: folder
        buildPhase: resources
    info:
      path: Info.plist
    entitlements:
      path: Config/ShopifyLarp.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.checker.shopifylarp
    dependencies:
      - target: ShopifyWidgets
        embed: true
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Config/ShopifyLarp.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.checker.shopifylarp
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        MARKETING_VERSION: "1.0.23"
        CURRENT_PROJECT_VERSION: "23"
    postbuildScripts:
      - name: Ensure ShopifyWeb.bundle in app
        script: |
          set -e
          DST="${TARGET_BUILD_DIR}/${WRAPPER_NAME}/ShopifyWeb.bundle"
          SRC="${SRCROOT}/ShopifyWeb.bundle"
          test -d "$SRC"
          mkdir -p "$DST"
          ditto "$SRC" "$DST"
          test -f "$DST/index.html"
          PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          # iOS letterboxes the app when the built Info.plist has no launch screen.
          # xcodegen was dropping UILaunchScreen, so write it into the product plist.
          /usr/libexec/PlistBuddy -c "Delete :UILaunchStoryboardName" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Delete :UILaunchScreen" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :UILaunchScreen dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :UIRequiresFullScreen true" "$PLIST" || /usr/libexec/PlistBuddy -c "Add :UIRequiresFullScreen bool true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.23" "$PLIST" || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 1.0.23" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 23" "$PLIST" || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string 23" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Shopify" "$PLIST" || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Shopify" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :UILaunchScreen" "$PLIST"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")" = "1.0.23"
  ShopifyWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ShopifyWidgets
      - path: Shared
    info:
      path: Config/ShopifyWidgets-Info.plist
      properties:
        CFBundleDisplayName: Shopify
        CFBundleName: ShopifyWidgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/ShopifyWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.checker.shopifylarp
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Config/ShopifyWidgets.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.checker.shopifylarp.widgets
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        MARKETING_VERSION: "1.0.23"
        CURRENT_PROJECT_VERSION: "23"
