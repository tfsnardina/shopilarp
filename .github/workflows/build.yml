name: Build ShopifyLarp IPA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      # 1. Télécharger le dépôt
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      # 2. Trouver le projet Xcode
      - name: Locate project
        shell: bash
        run: |
          set -euo pipefail

          echo "Recherche du projet Xcode..."

          PROJECT_YML=$(find "$GITHUB_WORKSPACE" \
            -type f -name project.yml \
            -not -path '*/.git/*' \
            -print -quit)

          if [ -z "$PROJECT_YML" ]; then
            echo "ERREUR : aucun project.yml trouvé."
            echo "Le dépôt doit contenir les fichiers du projet iOS."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_YML")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projet trouvé : $PROJECT_DIR"

      # 3. Vérifier le bundle Web présent dans le dépôt
      - name: Verify web bundle
        shell: bash
        run: |
          set -euo pipefail

          echo "Recherche de ShopifyWeb.bundle..."

          BUNDLE=$(find "$GITHUB_WORKSPACE" \
            -type f -path '*/ShopifyWeb.bundle/index.html' \
            -not -path '*/.git/*' \
            -print -quit)

          if [ -z "$BUNDLE" ]; then
            echo "ERREUR : ShopifyWeb.bundle/index.html introuvable."
            echo "Ajoute le bundle directement dans le dépôt GitHub."
            exit 1
          fi

          BUNDLE_DIR=$(dirname "$BUNDLE")

          echo "Bundle trouvé : $BUNDLE_DIR"
          echo "BUNDLE_SOURCE=$BUNDLE_DIR" >> "$GITHUB_ENV"

      # 3b. Xcode 26 (SDK iOS 26) pour le vrai Liquid Glass ; sinon la barre web est utilisée
      - name: Select Xcode 26 if available
        shell: bash
        run: |
          set -euo pipefail
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$X" ]; then
            sudo xcode-select -s "$X/Contents/Developer"
          else
            echo "Xcode 26 introuvable : build sans Liquid Glass natif."
          fi
          xcodebuild -version
          swift --version

      # 4. Installer XcodeGen
      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen

      # 5. Configurer les ressources Web
      - name: Configure web resources
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$PROJECT_DIR/ShopifyWeb.bundle"

          if [ "$BUNDLE_SOURCE" != "$PROJECT_DIR/ShopifyWeb.bundle" ]; then
            rm -rf "$PROJECT_DIR/ShopifyWeb.bundle"
            cp -R "$BUNDLE_SOURCE" "$PROJECT_DIR/ShopifyWeb.bundle"
          fi

          test -f "$PROJECT_DIR/ShopifyWeb.bundle/index.html"

          echo "Bundle Web configuré."

      # 6. Générer le projet Xcode
      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          xcodegen generate

          test -d ShopifyLarp.xcodeproj

      # 7. Compiler l'application
      - name: Build iOS application
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          xcodebuild \
            -project ShopifyLarp.xcodeproj \
            -scheme ShopifyLarp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      # 8. Vérifier l'application compilée
      - name: Verify app and web bundle
        shell: bash
        run: |
          set -euo pipefail

          APP=$(find "$PROJECT_DIR/build/Build/Products/Release-iphoneos" \
            -maxdepth 1 -type d -name '*.app' \
            -print -quit)

          if [ -z "$APP" ]; then
            echo "ERREUR : application .app introuvable."
            exit 1
          fi

          if [ ! -f "$APP/ShopifyWeb.bundle/index.html" ]; then
            echo "ERREUR : le bundle Web n'est pas intégré dans l'application."
            find "$APP" -maxdepth 3 -print
            exit 1
          fi

          echo "Application : $APP"
          echo "Bundle Web intégré."

      # 9. Générer directement le fichier IPA
      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          APP=$(find "$PROJECT_DIR/build/Build/Products/Release-iphoneos" \
            -maxdepth 1 -type d -name '*.app' \
            -print -quit)

          test -n "$APP"

          rm -rf Payload ShopifyLarp-unsigned.ipa
          mkdir -p Payload

          cp -R "$APP" Payload/

          /usr/bin/zip -qry ShopifyLarp-unsigned.ipa Payload

          test -s ShopifyLarp-unsigned.ipa

          echo "IPA créée : ShopifyLarp-unsigned.ipa"
          ls -lh ShopifyLarp-unsigned.ipa

      # 10. Publier l'IPA directement dans une GitHub Release
      - name: Publish IPA release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ipa-build-${{ github.run_number }}
          name: ShopifyLarp IPA Build ${{ github.run_number }}
          body: |
            Compilation automatique de ShopifyLarp.

            Fichier : ShopifyLarp-unsigned.ipa
            Attention : cette IPA n'est pas signée.
          files: ShopifyLarp-unsigned.ipa
          fail_on_unmatched_files: true
          generate_release_notes: false
          make_latest: false
