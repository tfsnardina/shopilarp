      - name: Configure web resources
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Recherche de ShopifyWeb.bundle..."
          find "$GITHUB_WORKSPACE" \
            -type f -path '*/ShopifyWeb.bundle/index.html' \
            -print

          if [ -f "$GITHUB_WORKSPACE/ShopifyWeb.bundle/index.html" ]; then
            BUNDLE_SOURCE="$GITHUB_WORKSPACE/ShopifyWeb.bundle"
          elif [ -f "$PROJECT_DIR/ShopifyWeb.bundle/index.html" ]; then
            BUNDLE_SOURCE="$GITHUB_WORKSPACE/$PROJECT_DIR/ShopifyWeb.bundle"
          else
            echo "ERREUR : index.html est introuvable."
            echo "Vérifie que ShopifyWeb.bundle contient bien index.html."
            exit 1
          fi

          # Évite de copier le dossier sur lui-même.
          if [ "$BUNDLE_SOURCE" != "$GITHUB_WORKSPACE/$PROJECT_DIR/ShopifyWeb.bundle" ]; then
            rm -rf ShopifyWeb.bundle
            cp -R "$BUNDLE_SOURCE" ShopifyWeb.bundle
          fi

          test -f ShopifyWeb.bundle/index.html

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("project.yml")
          text = p.read_text()

          if re.search(r'(?m)^  resources\s*:', text):
              if not re.search(
                  r'(?m)^\s+-\s+path:\s*ShopifyWeb\.bundle\s*$',
                  text
              ):
                  raise SystemExit(
                      "Ajoute ShopifyWeb.bundle à la section resources "
                      "de project.yml sans supprimer les ressources existantes."
                  )
          else:
              match = re.search(r'(?m)^  sources\s*:', text)
              if not match:
                  raise SystemExit("Section sources introuvable dans project.yml.")

              text = (
                  text[:match.start()]
                  + "  resources:\n    - path: ShopifyWeb.bundle\n"
                  + text[match.start():]
              )
              p.write_text(text)

          print("Ressources Web configurées.")
          PY

          xcodegen generate
