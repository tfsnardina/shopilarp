name: Build ShopifyLarp IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Localiser le projet
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_FILE="$(find "$GITHUB_WORKSPACE" \
            -type f -name project.yml \
            -not -path '*/.git/*' \
            -print -quit)"

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERREUR : project.yml introuvable."
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -print
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projet trouvé : $PROJECT_DIR"

      - name: Vérifier ShopifyWeb.bundle
        shell: bash
        run: |
          set -euo pipefail

          BUNDLE_INDEX="$(find "$GITHUB_WORKSPACE" \
            -type f \
            -path '*/ShopifyWeb.bundle/index.html' \
            -not -path '*/.git/*' \
            -print -quit)"

          if [ -z "$BUNDLE_INDEX" ]; then
            echo "ERREUR : ShopifyWeb.bundle/index.html introuvable."
            echo "Vérifie que le bundle est présent dans le dépôt."
            exit 1
          fi

          BUNDLE_SOURCE="$(dirname "$BUNDLE_INDEX")"
          echo "BUNDLE_SOURCE=$BUNDLE_SOURCE" >> "$GITHUB_ENV"
          echo "Bundle trouvé : $BUNDLE_SOURCE"

      - name: Installer XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen

      - name: Configurer les ressources web
        shell: bash
        run: |
          set -euo pipefail

          DEST="$PROJECT_DIR/ShopifyWeb.bundle"

          if [ "$BUNDLE_SOURCE" != "$DEST" ]; then
            rm -rf "$DEST"
            cp -R "$BUNDLE_SOURCE" "$DEST"
          fi

          test -f "$DEST/index.html"
          echo "ShopifyWeb.bundle prêt."

      - name: Générer le projet Xcode
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          xcodegen generate

      - name: Compiler l’application iOS
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          xcodebuild \
            -project ShopifyLarp.xcodeproj \
            -scheme ShopifyLarp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/ShopifyLarpBuild" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Vérifier l’application compilée
        shell: bash
        run: |
          set -euo pipefail

          APP_DIR="$RUNNER_TEMP/ShopifyLarpBuild/Build/Products/Release-iphoneos"

          APP="$(find "$APP_DIR" \
            -maxdepth 1 -type d -name '*.app' \
            -print -quit)"

          if [ -z "$APP" ]; then
            echo "ERREUR : application .app introuvable."
            exit 1
          fi

          if [ -f "$APP/ShopifyWeb.bundle/index.html" ]; then
            echo "Bundle trouvé dans ShopifyWeb.bundle."
          elif [ -f "$APP/index.html" ]; then
            echo "Bundle trouvé à la racine de l'application."
          elif [ -f "$APP/www/index.html" ]; then
            echo "Bundle trouvé dans www."
          else
            echo "ERREUR : index.html absent de l'application compilée."
            find "$APP" -name index.html -print
            exit 1
          fi

          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      - name: Créer l’IPA non signée
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"

          cd "$RUNNER_TEMP/ipa"

          /usr/bin/zip -qr \
            "$GITHUB_WORKSPACE/ShopifyLarp-unsigned.ipa" \
            Payload

          test -s "$GITHUB_WORKSPACE/ShopifyLarp-unsigned.ipa"

          echo "IPA créée avec succès."
          ls -lh "$GITHUB_WORKSPACE/ShopifyLarp-unsigned.ipa"

      - name: Publier l’IPA comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: ShopifyLarp-IPA
          path: ShopifyLarp-unsigned.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
