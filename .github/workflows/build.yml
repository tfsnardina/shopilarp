
name: Build ShopifyLarp IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Extraire le projet original
        run: |
          mkdir source
          unzip -o ShopifyLarp.zip -d source
          find source -name project.yml -print

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Générer le projet Xcode
        run: |
          cd source
          PROJECT_DIR=$(find . -name project.yml -print -quit | xargs dirname)
          cd "$PROJECT_DIR"
          xcodegen generate

      - name: Compiler l'application
        run: |
          cd source
          PROJECT_DIR=$(find . -name '*.xcodeproj' -print -quit)
          xcodebuild -project "$PROJECT_DIR" \
            -scheme ShopifyLarp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build

      - name: Créer l'IPA
        run: |
          APP=$(find source/build/Build/Products/Release-iphoneos -name '*.app' -type d -print -quit)
          test -n "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr ShopifyLarp-unsigned.ipa Payload

      - name: Publier l'IPA
        uses: actions/upload-artifact@v4
        with:
          name: ShopifyLarp-unsigned-ipa
          path: ShopifyLarp-unsigned.ipa
